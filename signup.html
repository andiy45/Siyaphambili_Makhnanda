<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<form action="urreg.php" method="POST">
    <table bgcolor="red" width="20%">
        <tr>
            <th colspan="2">
                <h3>COMPLETE USER REGISTRATION FORM</h3>
            </th>
        </tr>

        <tr>
            <td>ID NUMBER</td>
            <td>
                <input type="text" name="idnumber" maxlength="35" size="20" required>
            </td>
        </tr>

        <tr>
            <td>SURNAME</td>
            <td>
                <input type="text" name="surname" maxlength="35" size="20" required>
            </td>
        </tr>

        <tr>
            <td>FIRST NAME</td>
            <td>
                <input type="text" name="firstname" maxlength="35" size="20" required>
            </td>
        </tr>

        <tr>
            <td>USER ROLE</td>
            <td>
                <select id="userrole" name="userrole" required>
                    <option value="">Select role</option>
                    <option value="Administrator">Administrator</option>
                    <option value="Councillor">Councillor</option>
                    <option value="Guest">Guest</option>
                    <option value="Manager">Manager</option>
                    <option value="Municipal Worker">Municipal Worker</option>
                    <option value="Community Organisation">Community Organisation</option>
                    <option value="Resident">Resident</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>USER NAME</td>
            <td>
                <input type="text" name="username" maxlength="35" size="20" required>
            </td>
        </tr>

        <tr>
            <td>PASSWORD</td>
            <td>
                <input type="password" name="pword" maxlength="35" size="20" required>
            </td>
        </tr>

        <tr>
            <td>WARD</td>
            <td>
                <select id="ward" name="ward" required>
                    <option value="">Select Ward</option>
                    <option value="Ward 1">Ward 1</option>
                    <option value="Ward 2">Ward 2</option>
                    <option value="Ward 3">Ward 3</option>
                    <option value="Ward 4">Ward 4</option>
                    <option value="Ward 5">Ward 5</option>
                    <option value="Ward 6">Ward 6</option>
                    <option value="Ward 7">Ward 7</option>
                    <option value="Ward 8">Ward 8</option>
                    <option value="Ward 9">Ward 9</option>
                    <option value="Ward 10">Ward 10</option>
                    <option value="Ward 11">Ward 11</option>
                    <option value="Ward 12">Ward 12</option>
                    <option value="Ward 13">Ward 13</option>
                    <option value="Ward 14">Ward 14</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>PHYSICAL ADDRESS</td>
            <td>
                <textarea rows="4" cols="20" name="physAddress"></textarea>
            </td>
        </tr>

        <tr>
            <td>CONTACT</td>
            <td>
                <input type="text" name="contact" maxlength="15" size="20" required>
            </td>
        </tr>

        <tr>
            <td>EMAIL ADDRESS</td>
            <td>
                <input type="email" name="email" maxlength="35" size="20" required>
            </td>
        </tr>

        <tr>
            <td>
                <input type="submit" value="Create user">
            </td>
            <td>
                <input type="reset" value="Clear form">
            </td>
        </tr>

    </table>
</form>

</body>
</html>
